feign-client:
  url:
    haetsal-service: ${HAETSAL_SERVICE_PROD_URL}

kafka:
  bootstrap-servers: ${KAFKA_PROD_BOOTSTRAP_SERVERS}

spring:
  datasource:
    url: jdbc:mysql://${AUTH_PROD_DB_IP}:${AUTH_PROD_DB_PORT}/${AUTH_PROD_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul
    username: ${AUTH_PROD_DB_USERNAME}
    password: ${AUTH_PROD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    root: INFO
    com.eum.auth: DEBUG
    org.springframework:
      web: DEBUG
      security: INFO